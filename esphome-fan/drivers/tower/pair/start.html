<style>
  .board { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:8px;
           border:1px solid var(--homey-line-color, #ddd); border-radius:10px; cursor:pointer; }
  .board.disabled { opacity:.5; cursor:default; }
  .board .info { flex:1; min-width:0; }
  .board .title { font-weight:600; }
  .board .sub { font-size:12px; opacity:.7; overflow:hidden; text-overflow:ellipsis; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#2A9D8F; color:#fff; white-space:nowrap; }
  .badge.warn { background:#e9c46a; color:#000; }
  .badge.grey { background:#999; }
  .link { text-align:center; margin-top:14px; }
  .link a { cursor:pointer; text-decoration:underline; }
</style>

<!-- Step 0: search -->
<div id="step0">
  <h1 class="homey-title" data-i18n="pair.search_title"></h1>
  <p class="homey-subtitle" id="searchStatus" data-i18n="pair.searching"></p>
  <div id="boards"></div>
  <button class="homey-button-secondary-full" type="button" id="rescan" data-i18n="pair.search_again"></button>
  <div class="link"><a id="manualLink" data-i18n="pair.manual"></a></div>
</div>

<!-- Step 1: manual IP -->
<div id="step1" style="display:none">
  <form id="form1" class="homey-form">
    <h1 class="homey-title" data-i18n="pair.title"></h1>
    <p class="homey-subtitle" data-i18n="pair.intro"></p>
    <div class="homey-form-group">
      <label class="homey-form-label" for="host" data-i18n="pair.host"></label>
      <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.60" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="username" data-i18n="pair.username"></label>
      <input class="homey-form-input" id="username" type="text" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="password" data-i18n="pair.password"></label>
      <input class="homey-form-input" id="password" type="password" />
    </div>
    <button class="homey-button-primary-full" type="submit" data-i18n="pair.scan"></button>
  </form>
</div>

<!-- Step 2: configure -->
<div id="step2" style="display:none">
  <form id="form2" class="homey-form">
    <h1 class="homey-title" data-i18n="pair.configure"></h1>
    <p id="detected" class="homey-subtitle"></p>
    <div class="homey-form-group">
      <label class="homey-form-label" for="name" data-i18n="pair.name"></label>
      <input class="homey-form-input" id="name" type="text" />
    </div>
    <div id="relayGroup" style="display:none">
      <p class="homey-subtitle" data-i18n="pair.relay_hint"></p>
      <div id="slots"></div>
      <button class="homey-button-secondary-full" type="button" id="addSlot" data-i18n="pair.add_speed"></button>
    </div>
    <br />
    <button class="homey-button-primary-full" type="submit" data-i18n="pair.add"></button>
  </form>
</div>

<script type="text/javascript">
let scan = null;
let board = null;
const $ = id => document.getElementById(id);
const show = step => ['step0', 'step1', 'step2'].forEach(s => { $(s).style.display = s === step ? '' : 'none'; });
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function badge(b) {
  if (b.taken) return `<span class="badge grey">${Homey.__('pair.badge_added')}</span>`;
  if (b.error === 'auth') return `<span class="badge warn">${Homey.__('pair.badge_auth')}</span>`;
  if (!b.webServer) return `<span class="badge warn">${Homey.__('pair.badge_no_web')}</span>`;
  if (b.scan && b.scan.ultimate) return `<span class="badge">${Homey.__('pair.badge_fan')}</span>`;
  if (b.suggested) return `<span class="badge">${Homey.__('pair.badge_suggested')}</span>`;
  return '';
}

async function search() {
  $('searchStatus').textContent = Homey.__('pair.searching');
  $('boards').innerHTML = '';
  try {
    const boards = await Homey.emit('discover');
    if (!boards.length) {
      $('searchStatus').textContent = Homey.__('pair.none_found');
      return;
    }
    $('searchStatus').textContent = Homey.__('pair.found_n').replace('{n}', boards.length);
    for (const b of boards) {
      const el = document.createElement('div');
      const usable = !b.taken && (b.webServer || b.error === 'auth');
      el.className = 'board' + (usable ? '' : ' disabled');
      el.innerHTML = `<div class="info"><div class="title">${esc(b.name)}</div>
        <div class="sub">${esc(b.host)}${b.hostname ? ' · ' + esc(b.hostname) : ''}</div></div>${badge(b)}`;
      if (usable) {
        el.addEventListener('click', () => {
          board = b;
          if (b.error === 'auth') {
            $('host').value = b.host;
            show('step1');
            return;
          }
          connect({ host: b.host, mac: b.mac, name: b.name });
        });
      }
      $('boards').append(el);
    }
  } catch (err) {
    $('searchStatus').textContent = err.message || err;
  }
}

function addSlot(selected) {
  const n = $('slots').children.length + 1;
  if (n > 4) return;
  const wrap = document.createElement('div');
  wrap.className = 'homey-form-group';
  const label = document.createElement('label');
  label.className = 'homey-form-label';
  label.textContent = Homey.__('pair.speed_n').replace('{n}', n);
  const sel = document.createElement('select');
  sel.className = 'homey-form-select relay';
  sel.innerHTML = '<option value="">—</option>' + scan.switches
    .map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.id)})</option>`).join('');
  if (selected) sel.value = selected;
  wrap.append(label, sel);
  $('slots').append(wrap);
}

async function connect(data) {
  Homey.showLoadingOverlay();
  try {
    scan = await Homey.emit('scan', data);
    Homey.hideLoadingOverlay();
    const type = await Homey.emit('fan_type');
    $('name').value = data.name || Homey.__('pair.type_' + type);
    $('slots').innerHTML = '';
    if (scan.ultimate) {
      $('detected').textContent = Homey.__('pair.detected_ultimate').replace('{n}', scan.maxSpeed);
      $('relayGroup').style.display = 'none';
    } else {
      $('detected').textContent = Homey.__('pair.detected_relays');
      $('relayGroup').style.display = '';
      const guess = scan.switches.filter(s => /relay|rel/i.test(s.id)).slice(0, 3).map(s => s.id);
      (guess.length ? guess : [null]).forEach(addSlot);
    }
    show('step2');
  } catch (err) {
    Homey.hideLoadingOverlay();
    Homey.alert(err.message || err, 'error');
  }
}

$('rescan').addEventListener('click', search);
$('manualLink').addEventListener('click', () => { board = null; show('step1'); });
$('addSlot').addEventListener('click', () => addSlot());

$('form1').addEventListener('submit', e => {
  e.preventDefault();
  connect({
    host: $('host').value,
    username: $('username').value,
    password: $('password').value,
    mac: board && board.mac,
    name: board && board.name,
  });
});

$('form2').addEventListener('submit', async e => {
  e.preventDefault();
  const relays = [...document.querySelectorAll('select.relay')].map(s => s.value).filter(Boolean);
  Homey.showLoadingOverlay();
  try {
    const device = await Homey.emit('create', { name: $('name').value, relays });
    if (device) await Homey.createDevice(device);
    Homey.done();
  } catch (err) {
    Homey.hideLoadingOverlay();
    Homey.alert(err.message || err, 'error');
  }
});

search();
</script>
